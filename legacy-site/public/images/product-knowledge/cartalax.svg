<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Cartalax AED sequence diagram</title>
  <desc id="desc">A sequence diagram showing alanine, glutamic acid and aspartic acid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0b315e"/>
      <stop offset="1" stop-color="#031329"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001020" flood-opacity=".55"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <g opacity=".14" stroke="#6dd5fb" fill="none">
    <circle cx="90" cy="90" r="48"/><circle cx="710" cy="430" r="70"/>
    <path d="M0 390L190 250 365 335 540 180 800 285"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M220 260H580" stroke="#73d9ff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="220" cy="260" r="88" fill="#075ee8" stroke="#b8efff" stroke-width="4"/>
    <circle cx="400" cy="260" r="88" fill="#0b7ecd" stroke="#b8efff" stroke-width="4"/>
    <circle cx="580" cy="260" r="88" fill="#169fcf" stroke="#b8efff" stroke-width="4"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="220" y="281" font-size="64" font-weight="700">A</text>
    <text x="400" y="281" font-size="64" font-weight="700">E</text>
    <text x="580" y="281" font-size="64" font-weight="700">D</text>
    <text x="220" y="382" font-size="20" letter-spacing="2">ALANINE</text>
    <text x="400" y="382" font-size="20" letter-spacing="2">GLUTAMIC ACID</text>
    <text x="580" y="382" font-size="20" letter-spacing="2">ASPARTIC ACID</text>
    <text x="400" y="90" font-size="25" font-weight="700" letter-spacing="8">CARTALAX · AED</text>
  </g>
</svg>
